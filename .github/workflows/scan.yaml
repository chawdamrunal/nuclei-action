name: Nuclei Domain Scan

on:
  workflow_dispatch:
  push:
    paths:
      - "ing.txt"

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Nuclei scan on ing.txt domains
        uses: projectdiscovery/nuclei-action@v3
        with:
          args: "-l ing.txt -severity critical,high,medium -stats -ni -o nuclei-output.txt -me nuclei-output"
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Print scan results
        if: always()
        run: |
          echo "::group::Nuclei findings"
          if [ -f nuclei-output.txt ]; then
            cat nuclei-output.txt
          else
            echo "No output file found"
          fi
          echo "::endgroup::"

      - name: Upload results as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nuclei-scan-results
          path: |
            nuclei-output.txt
            nuclei-output/
          if-no-files-found: ignore
          retention-days: 30
